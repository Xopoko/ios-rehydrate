name: Bug report
description: Report a reproducible problem.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach IPAs, backups, receipts, raw logs, device/account identifiers, or screenshots.
        Security issues go through private reporting — see SECURITY.md.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the command you ran and the `error[REASON]` line it printed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: ios-rehydrate 0.1.0, Windows 11, Python 3.13, iOS 18.x
    validations:
      required: true
