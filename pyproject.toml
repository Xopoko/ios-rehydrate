[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ios-rehydrate"
version = "0.1.0"
description = "Restore an offloaded iOS app from a local IPA via InstallationProxy Upgrade"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
keywords = ["ios", "iphone", "ipa", "backup", "mobilebackup2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: Utilities",
]
dependencies = [
  "pyiosbackup==0.2.4",
  "pymobiledevice3==11.1.6",
  "typer==0.27.1",
]

[project.urls]
Homepage = "https://github.com/Xopoko/ios-rehydrate"
Issues = "https://github.com/Xopoko/ios-rehydrate/issues"

[project.scripts]
ios-rehydrate = "ios_rehydrate.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<3",
  "pytest>=8.3,<10",
  "pytest-mock>=3.14,<4",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ios_rehydrate"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/SECURITY.md", "/CONTRIBUTING.md"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ios_rehydrate"]
warn_unused_ignores = true
